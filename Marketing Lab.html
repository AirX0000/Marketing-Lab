const S=JSON.parse(document.getElementById("data").textContent);let EDIT=false,F={c:"",q:""};
const CATS=["Educational","Research","Campaign Analysis","News","Opinion","Events","Behind the Scenes"];
const ICON={"Educational":"🎓","Research":"📊","Campaign Analysis":"🔍","News":"📰","Opinion":"💬","Events":"🎤","Behind the Scenes":"🎬"};
const DESC={"Educational":"Clear explainers on marketing concepts, tools and frameworks.","Research":"Data-based findings that turn numbers into decisions.","Campaign Analysis":"Breaking down brand decisions and what made campaigns work.","News":"Current developments, with the context that makes them meaningful.","Opinion":"Informed perspectives from the next generation of marketers.","Events":"Coverage and content from Lab events and student projects.","Behind the Scenes":"The stories of the people who make the Lab happen."};
const SOC={instagram:["IG","Instagram"],linkedin:["in","LinkedIn"],telegram:["TG","Telegram"],youtube:["YT","YouTube"],tiktok:["TT","TikTok"]};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mem=id=>S.team.find(m=>m.id==id),pst=id=>S.posts.find(p=>p.id==id);
const ini=n=>n.split(/\s+/).slice(0,2).map(s=>s[0]||"").join("").toUpperCase();
const mins=p=>Math.max(1,Math.round((p.b||"").split(/\s+/).length/200));
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const av=(m,z)=>`<div class="av" style="${z?`width:${z}px;height:${z}px;font-size:${z/3}px;margin:0`:""}">${m.ph?`<img src="${esc(m.ph)}" alt="">`:esc(ini(m.n))}</div>`;
const cover=(p,h)=>`<div class="thumb" style="${h?`height:${h}px;border-radius:14px;margin:24px 0;`:""}background-image:linear-gradient(#0002,#0007),url('${p.cv?esc(p.cv):art(p)}');background-size:cover;background-position:center">${esc(p.c)}</div>`;
const who=p=>mem(p.a)?mem(p.a).n:"Lab member";
const PAL={'Educational':['#76080f','#a3262e'],'Research':['#5a060b','#8c1a22'],'Campaign Analysis':['#7a1020','#b8483c'],'News':['#4a0a10','#76080f'],'Opinion':['#8a1c24','#c06a4a'],'Events':['#6b0b14','#a8322f'],'Behind the Scenes':['#3d0a10','#7a1a22']};
function art(p){const q=PAL[p.c]||PAL.Educational,k=CATS.indexOf(p.c);let s=(+p.id||1)*9301+49297,g='';const r=()=>(s=(s*9301+49297)%233280)/233280;
if(k<2){for(let i=0;i<8;i++){const h=30+r()*110;g+=`<rect x='${20+i*46}' y='${200-h}' width='30' height='${h}' fill='#fff' opacity='.16'/>`}}
else if(k<4){let d='M0 170';for(let i=1;i<=8;i++)d+=`L${i*50} ${170-r()*110}`;g=`<path d='${d}' fill='none' stroke='#ecd08a' stroke-width='3' opacity='.75'/>`}
else{for(let i=0;i<7;i++)g+=`<circle cx='${r()*400}' cy='${r()*200}' r='${14+r()*46}' fill='#fff' opacity='.1'/>`}
return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 200' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${q[0]}'/><stop offset='1' stop-color='${q[1]}'/></linearGradient></defs><rect width='400' height='200' fill='url(#g)'/>${g}</svg>`).replace(/[()']/g,c=>'%'+c.charCodeAt(0).toString(16))}
const feat=p=>`<a class="feat rv" href="#/article/${p.id}">${cover(p,320)}<div><div class="eyebrow">${esc(p.c)}</div><h2>${esc(p.t)}</h2><p>${esc(p.x)}</p><small>${esc(p.d)} · ${mins(p)} min read · ${esc(who(p))}</small><div><span class="btn sm" style="margin-top:18px">Read article →</span></div></div></a>`;
const tick=()=>{const h=S.posts.map(p=>`<span>${esc(p.c)}: ${esc(p.t)}</span>`).join('');return h?`<div class="tk"><div>${h}${h}</div></div>`:''};
const authorCard=m=>`<a class="acard" href="#/team/${m.id}">${av(m,64)}<div><small>Written by</small><h3>${esc(m.n)}</h3><p>${esc(m.r)} · ${esc(m.bio)}</p></div></a>`;
const pn=p=>{const i=S.posts.indexOf(p),n=S.posts[i-1],o=S.posts[i+1];return `<div class="pn">${o?`<a href="#/article/${o.id}"><small>← Older</small><b>${esc(o.t)}</b></a>`:'<span></span>'}${n?`<a href="#/article/${n.id}" style="text-align:right"><small>Newer →</small><b>${esc(n.t)}</b></a>`:'<span></span>'}</div>`};
const postCard=p=>`<a class="post rv" href="#/article/${p.id}">${cover(p)}<div class="b"><h3>${esc(p.t)}</h3><p>${esc(p.x)}</p><small>${esc(p.d)} · ${mins(p)} min read · ${esc(who(p))}</small></div></a>`;
const socials=()=>Object.entries(SOC).filter(([k])=>S.cfg.soc[k]).map(([k,v])=>`<a class="soc" href="${esc(S.cfg.soc[k])}" target="_blank" rel="noopener" aria-label="${v[1]}">${v[0]}</a>`).join("");
const mail=(s,b)=>{location.href=`mailto:${S.cfg.email}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`};
const ph=(h,p)=>{const k='ph_'+h;return `<div class="ph"><div class="w"><h1>${esc((S.pg&&S.pg[k+'_t'])||h)}</h1><p>${esc((S.pg&&S.pg[k+'_p'])||p)}</p></div></div>`};
const band={toString:()=>`<section style="padding-top:0"><div class="w"><div class="cband"><h2>${esc(T('cta_title'))}</h2><p>${esc(T('cta_text'))}</p><a class="btn w2" href="#/join">Join the Lab</a></div></div></section>`};
const fld=(l,n,v,a)=>`<label>${l}${a?`<textarea name="${n}" rows="${a}">${esc(v)}</textarea>`:`<input name="${n}" value="${esc(v)}">`}</label>`;
const upf=(l,n,v)=>`<label>${l}<input name="${n}" value="${esc(v)}" placeholder="Paste a URL or upload below"><input type="file" accept="image/*" onchange="up(this,'${n}')"></label>`;
const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
function theme(){const r=document.documentElement,d=matchMedia("(prefers-color-scheme:dark)").matches,n=(r.dataset.theme||(d?"dark":"light"))==="dark"?"light":"dark";r.dataset.theme=n;try{localStorage.setItem("th",n)}catch(e){}}
try{const t=localStorage.getItem("th");if(t)document.documentElement.dataset.theme=t}catch(e){}
