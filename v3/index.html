try {

  S = inline ? JSON.parse(inline.textContent) : {"cfg":{"adminPass":"admin123","email":"marketinglab@bmu-edu.uz","joinUrl":"","newsUrl":"","soc":{"tg":"https://t.me/bmu_marketing_lab","li":"https://www.linkedin.com/school/british-management-university","ig":"https://www.instagram.com/bmu_marketinglab","yt":""},"stats":[["500+","Campus Members"],["48+","Published Insights"],["100%","Student-Led"],["12","Industry Partners"]]},"tx":{"hero_kicker":"British Management University · Student publication","hero_title":"Think like marketers. <em>Act like analysts.</em> Create like industry professionals.","words_mission":"We bridge academia and industry by empowering students to research, create and publish real marketing insights.","latest_title":"Latest from the Lab","latest_sub":"Sample entries. Replace them with real articles.","cta_title":"Ready to publish real work?","cta_text":"Join a community of students who research, write and present marketing insights that matter.","cta_btn":"Join the Lab","about_h1":"About the Lab","about_p":"A student-driven marketing publication and professional community connected to British Management University.","letter_title":"A letter from <em>our team</em>","letter_p1":"When we launched the Marketing Insights Lab, our goal was simple: research and curate latest marketing trends and make marketing education more practical.","letter_p2":"Since we launched the project students explored campaigns, learned from international speakers, collaborated with industry partners and created content that reached audiences well beyond our university.","letter_p3":"We are proud of what a student-led team achieved with faculty guidance and even more excited about what comes next.","letter_sign":"Marketing Insights Lab Team"},"fm":[["Educational content","Clear explainers on marketing concepts, tools and frameworks."],["Research and insights","Data-based findings that turn numbers into decisions."],["Campaign analyses","Deconstructions of breakthrough advertising and brand turnarounds."],["Opinion pieces","Thought leadership that questions common marketing assumptions."],["Industry news","Fast, contextualised takes on marketing developments."],["Behind the scenes","How our editorial team works, researches and edits."],["Lab events","Workshops, speaker sessions and student hackathons."]],"cats":["Campaign Analysis","Research","Educational","Opinion","News","Behind the Scenes","Events"],"posts":[{"id":1,"c":"Campaign Analysis","t":"How Red Bull Built a $10B Media Powerhouse Disguised as an Energy Drink","x":"An in-depth breakdown of Red Bull's non-traditional marketing blueprint: content studio ownership, event IP, and lifestyle positioning over product ads.","a":1,"d":"2026-10-14","cv":"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=1200&q=80","f":true,"b":"Most consumer packaged goods (CPG) companies spend 20% to 30% of their revenue on traditional performance marketing and media buying. Red Bull chose a radically different path: they built a media company that happens to sell an energy drink in a silver-and-blue can.\n\n### 1. The Strategy: Don't Buy Ads, Own the Culture\nDietrich Mateschitz famously declared that Red Bull wasn't competing for shelf space; it was competing for adrenaline. Instead of sponsoring existing sports teams, Red Bull founded its own: Formula 1 championship teams, soccer clubs across three continents, and extreme stunt operations like Felix Baumgartner's Stratos jump from the edge of space.\n\n> \"Red Bull does not sponsor events. Red Bull creates and owns the intellectual property that fans obsess over.\"\n\n### 2. The Content Studio Flywheel\nBy forming Red Bull Media House in 2007, the brand transitioned from sponsor to production powerhouse:\n- **Licensing Revenue:** High-production films and documentaries sold to Netflix, ESPN, and national broadcasters.\n- **Organic Virality:** Over 15 million YouTube subscribers generating billions of organic impressions at near-zero marginal cost.\n- **Zero Mention of the Product:** The can rarely appears in their flagship documentaries. The brand is synonymous with extreme human achievement.\n\n### Key Takeaways for Student Marketers:\n1. **Audience-First Architecture:** Identify the emotional peak of your target audience and build media around that feeling.\n2. **IP Ownership Beats Renting:** When you own the tournament or media platform, you capture all downstream audience data and brand equity.\n3. **Product as a Badge:** The physical product becomes a ticket to belong to a global community rather than merely a beverage."},{"id":2,"c":"Research","t":"Gen Z Consumer Behavior in Central Asia: The Rise of Social Commerce & FinTech","x":"Empirical survey data from 450+ university students examining payment frictionless-ness, influencer conversion credibility, and short-form video engagement.","a":2,"d":"2026-09-24","cv":"https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Over the past three years, the convergence of high mobile penetration and super-app fintech has transformed how Central Asian youth discover, evaluate, and purchase products. Our research team at Marketing Insights Lab surveyed 450 undergraduate and postgraduate students to analyze purchasing funnels.\n\n### 1. The Frictionless Checkout Revolution\nOver 78% of surveyed respondents reported completing purchases directly via in-app marketplaces or peer-to-peer digital checkout rather than traditional point-of-sale or standalone eCommerce websites. Speed and zero-step onboarding trump brand loyalty in everyday transactions.\n\n### 2. Micro-Influencer Trust vs. Macro Celebrity Ads\nStudents demonstrated an 82% higher willingness to purchase products recommended by niche domain specialists (under 25,000 followers) compared to mainstream celebrity brand ambassadors. Authenticity in unedited vertical video format drove 3.4x higher conversion metrics."},{"id":3,"c":"Opinion","t":"Is AI-Generated Advertising Worth the Risk or Exposing Mediocre Copywriting?","x":"Why large language models will commoditize surface-level creative output while exponentially increasing the value of genuine brand taste and contrarian positioning.","a":4,"d":"2026-09-17","cv":"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80","f":false,"b":"As generative AI tools flood agency workflows with instant copy variants and synthetic imagery, marketing departments face an unexpected paradox: when creating content becomes effortless, standing out becomes exponentially harder.\n\n### The Sea of Synthesised Blandness\nAI models are trained to predict the most probable next token — meaning they inherently generate the average of human creative expression. If your brand positioning relies on generic adjectives, AI will replace you tomorrow.\n\n### What Remains Irreplaceable:\n- **Original Taste:** Knowing what *not* to say.\n- **Cultural Subversion:** Spotting emergent cultural tensions before they enter the training dataset.\n- **Audience Empathy:** Understanding human emotional friction that raw data cannot capture."},{"id":4,"c":"Educational","t":"The Complete Guide to Brand Archetypes: Crafting Distinctive Brand Voice in 2026","x":"A step-by-step practical framework adapted from Carl Jung and Margaret Mark to align brand storytelling, visual identity, and messaging tone.","a":3,"d":"2026-09-10","cv":"https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Every enduring brand in history represents a psychological archetype: Nike is The Hero, Harley-Davidson is The Outlaw, Apple is The Creator, and Dove is The Innocent.\n\n### Why Archetypes Matter in Marketing\nWithout an archetype, marketing copy drifts across conflicting tones depending on who writes the copy that day. With a defined archetype, every Instagram caption, press release, and packaging copy flows from a unified character blueprint."},{"id":5,"c":"News","t":"Retail Media Networks & Third-Party Cookies: What Marketers Must Prepare for in 2026","x":"Key news and developments on retail media networks, first-party data capture, and privacy-preserving attribution models.","a":5,"d":"2026-09-03","cv":"https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Retail Media Networks (RMNs) have surpassed traditional linear television advertising in total annual ad spend. By monetising digital checkout aisles, regional retailers are transforming into advertising technology platforms."},{"id":6,"c":"Behind the Scenes","t":"From Classroom Theory to Real Publication: How We Built the Marketing Insights Lab","x":"A transparent reflection on our student-led editorial workflows, research methodologies, and challenges building an academic publication.","a":1,"d":"2026-08-27","cv":"https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Textbooks teach marketing frameworks that were formulated before smartphones existed. Our goal when launching the Marketing Insights Lab at British Management University was to create a sandbox where students analyze live campaigns, publish under their own byline, and build a competitive professional portfolio."},{"id":7,"c":"Events","t":"Recap: Our First Lab Industry Meetup with Regional CMOs","x":"Highlights, panel discussions, and key lessons from our inaugural on-campus symposium connecting students with brand executives.","a":6,"d":"2026-08-20","cv":"https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Over 120 students and 8 invited brand directors gathered at the BMU Main Auditorium for an intensive panel discussion on brand positioning and modern consumer analytics."}],"team":[{"id":1,"n":"Ayder Parmankulov","r":"Editor-in-Chief & Co-Founder","g":"Leadership","bio":"Leads the editorial vision, publication roadmap, and university brand partnerships for the Lab. Passionate about strategic positioning and brand architecture.","resp":["Oversee editorial board and approval of all published insights","Lead corporate partnerships and guest speaker series","Represent the Lab across university academic and industry boards"],"sk":["Brand Strategy","Editorial Leadership","Campaign Architecture","Project Management"],"ph":"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":2,"n":"Dmitriy Kim","r":"Head of Research & Analytics","g":"Research & Strategy","bio":"Quantitative researcher focusing on consumer psychology, behavioral economics, and survey modeling in emerging markets.","resp":["Design empirical survey methodologies and sample architectures","Lead data verification and statistical fact-checking","Mentor junior researchers on quantitative analysis frameworks"],"sk":["Consumer Insights","SPSS / Python","Data Visualization","Market Sizing"],"ph":"https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":3,"n":"Malika Alimova","r":"Campaign Analysis Lead","g":"Research & Strategy","bio":"Deconstructs breakthrough regional and global advertising campaigns, rebranding initiatives, and product launch rollouts.","resp":["Select and approve campaign case study targets","Develop standardized teardown frameworks (Brief, Strategy, Execution, Results)","Coordinate peer review rounds for analysis articles"],"sk":["Brand Strategy","Case Study Teardowns","Visual Storytelling","Copy Analysis"],"ph":"https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":4,"n":"Kamila Tursunova","r":"Opinion & Thought Leadership Editor","g":"Editorial","bio":"Fosters critical perspectives on AI ethics, digital consumption trends, and provocative debates in contemporary marketing.","resp":["Curate and commission thought-provoking commentary essays","Work one-on-one with student writers on argumentation and voice","Maintain editorial tone and debate standards"],"sk":["Critical Writing","Argumentation","Editorial Coaching","Content Curation"],"ph":"https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":5,"n":"Rustam Saidov","r":"Industry News Editor","g":"Editorial","bio":"Tracks global and regional marketing movements, platform algorithm shifts, and commercial developments.","resp":["Publish monthly curated industry briefings","Monitor international marketing journals and press releases","Contextualize platform privacy updates for student audiences"],"sk":["News Gathering","Market Monitoring","Fact-Checking","Fast-Paced Copywriting"],"ph":"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":6,"n":"Zilola Rakhimova","r":"Events & Symposia Coordinator","g":"Events","bio":"Manages on-campus masterclasses, CMO roundtable discussions, and student marketing hackathons.","resp":["Liaise with visiting industry executives and keynote speakers","Plan logistics, live streaming, and student attendee registrations","Coordinate post-event insight summaries and video highlights"],"sk":["Event Management","Public Relations","Stakeholder Coordination","Logistics"],"ph":"https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":7,"n":"Sardor Mukhamedov","r":"Creative & Visual Design Lead","g":"Creative & Design","bio":"Shapes the visual identity, cover photography art direction, and typography standards across all Lab channels.","resp":["Ensure strict adherence to BMU Marketing Lab design guidelines","Direct cover artwork and editorial infographic production","Manage typography and brand visual consistency"],"sk":["Figma / Adobe Suite","Art Direction","Brand Identity","Motion Graphics"],"ph":"https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false},{"id":8,"n":"Dr. Alistair Ross","r":"Faculty Academic Advisor","g":"Advisory","bio":"Senior Lecturer in Marketing Strategy at British Management University. Mentors students on academic rigor and research standards.","resp":["Ensure alignment with university academic governance","Connect student researchers with international academic journals","Provide strategic guidance to the executive student board"],"sk":["Academic Research","Pedagogy","Strategic Governance","Mentorship"],"ph":"https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=400&q=80","ln":"https://linkedin.com","hidden":false}],"faq":[["Do I need prior marketing experience to join?","No. We welcome students from all years and courses who are curious about marketing, willing to learn and ready to work on real insights."],["How much time does it take per week?","Most members dedicate 3 to 6 hours per week depending on whether they are writing an article, running an event or conducting research."],["Who can join the Marketing Insights Lab?","Any currently enrolled student at British Management University or partner institutions interested in marketing, analytics, or media."],["Can I publish my university coursework here?","Yes! Coursework that undergoes our editorial review and fact-checking can be adapted into public portfolio articles."]],"steps_about":[["Research","Pick a real marketing development and investigate it with data."],["Create","Turn findings into a useful, well-structured insight."],["Publish","Go through editorial review and publish under your name."],["Grow","Add the work to your portfolio and your CV."]],"steps_join":[["Apply","Fill in a short application with yo  pieces","Thought leadership that questions common marketing assumptions."],["Industry news","Fast, contextualised takes on marketing developments."],["Behind the scenes","How our editorial team works, researches and edits."],["Lab events","Workshops, speaker sessions and student hackathons."]],"cats":["Campaign Analysis","Research","Educational","Opinion","News","Behind the Scenes","Events"],"posts":[{"id":1,"c":"Campaign Analysis","t":"How Red Bull Built a $10B Media Powerhouse Disguised as an Energy Drink","x":"An in-depth breakdown of Red Bull's non-traditional marketing blueprint: content studio ownership, event IP, and lifestyle positioning over product ads.","a":1,"d":"2026-10-14","cv":"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=1200&q=80","f":true,"b":"Most consumer packaged goods (CPG) companies spend 20% to 30% of their revenue on traditional performance marketing and media buying. Red Bull chose a radically different path: they built a media company that happens to sell an energy drink in a silver-and-blue can.\n\n### 1. The Strategy: Don't Buy Ads, Own the Culture\nDietrich Mateschitz famously declared that Red Bull wasn't competing for shelf space; it was competing for adrenaline. Instead of sponsoring existing sports teams, Red Bull founded its own: Formula 1 championship teams, soccer clubs across three continents, and extreme stunt operations like Felix Baumgartner's Stratos jump from the edge of space.\n\n> \"Red Bull does not sponsor events. Red Bull creates and owns the intellectual property that fans obsess over.\"\n\n### 2. The Content Studio Flywheel\nBy forming Red Bull Media House in 2007, the brand transitioned from sponsor to production powerhouse:\n- **Licensing Revenue:** High-production films and documentaries sold to Netflix, ESPN, and national broadcasters.\n- **Organic Virality:** Over 15 million YouTube subscribers generating billions of organic impressions at near-zero marginal cost.\n- **Zero Mention of the Product:** The can rarely appears in their flagship documentaries. The brand is synonymous with extreme human achievement.\n\n### Key Takeaways for Student Marketers:\n1. **Audience-First Architecture:** Identify the emotional peak of your target audience and build media around that feeling.\n2. **IP Ownership Beats Renting:** When you own the tournament or media platform, you capture all downstream audience data and brand equity.\n3. **Product as a Badge:** The physical product becomes a ticket to belong to a global community rather than merely a beverage."},{"id":2,"c":"Research","t":"Gen Z Consumer Behavior in Central Asia: The Rise of Social Commerce & FinTech","x":"Empirical survey data from 450+ university students examining payment frictionless-ness, influencer conversion credibility, and short-form video engagement.","a":2,"d":"2026-09-24","cv":"https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Over the past three years, the convergence of high mobile penetration and super-app fintech has transformed how Central Asian youth discover, evaluate, and purchase products. Our research team at Marketing Insights Lab surveyed 450 undergraduate and postgraduate students to analyze purchasing funnels.\n\n### 1. The Frictionless Checkout Revolution\nOver 78% of surveyed respondents reported completing purchases directly via in-app marketplaces or peer-to-peer digital checkout rather than traditional point-of-sale or standalone eCommerce websites. Speed and zero-step onboarding trump brand loyalty in everyday transactions.\n\n### 2. Micro-Influencer Trust vs. Macro Celebrity Ads\nStudents demonstrated an 82% higher willingness to purchase products recommended by niche domain specialists (under 25,000 followers) compared to mainstream celebrity brand ambassadors. Authenticity in unedited vertical video format drove 3.4x higher conversion metrics."},{"id":3,"c":"Opinion","t":"Is AI-Generated Advertising Worth the Risk or Exposing Mediocre Copywriting?","x":"Why large language models will commoditize surface-level creative output while exponentially increasing the value of genuine brand taste and contrarian positioning.","a":4,"d":"2026-09-17","cv":"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80","f":false,"b":"As generative AI tools flood agency workflows with instant copy variants and synthetic imagery, marketing departments face an unexpected paradox: when creating content becomes effortless, standing out becomes exponentially harder.\n\n### The Sea of Synthesised Blandness\nAI models are trained to predict the most probable next token — meaning they inherently generate the average of human creative expression. If your brand positioning relies on generic adjectives, AI will replace you tomorrow.\n\n### What Remains Irreplaceable:\n- **Original Taste:** Knowing what *not* to say.\n- **Cultural Subversion:** Spotting emergent cultural tensions before they enter the training dataset.\n- **Audience Empathy:** Understanding human emotional friction that raw data cannot capture."},{"id":4,"c":"Educational","t":"The Complete Guide to Brand Archetypes: Crafting Distinctive Brand Voice in 2026","x":"A step-by-step practical framework adapted from Carl Jung and Margaret Mark to align brand storytelling, visual identity, and messaging tone.","a":3,"d":"2026-09-10","cv":"https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Every enduring brand in history represents a psychological archetype: Nike is The Hero, Harley-Davidson is The Outlaw, Apple is The Creator, and Dove is The Innocent.\n\n### Why Archetypes Matter in Marketing\nWithout an archetype, marketing copy drifts across conflicting tones depending on who writes the copy that day. With a defined archetype, every Instagram caption, press release, and packaging copy flows from a unified character blueprint."},{"id":5,"c":"News","t":"Retail Media Networks & Third-Party Cookies: What Marketers Must Prepare for in 2026","x":"Key news and developments on retail media networks, first-party data capture, and privacy-preserving attribution models.","a":5,"d":"2026-09-03","cv":"https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Retail Media Networks (RMNs) have surpassed traditional linear television advertising in total annual ad spend. By monetising digital checkout aisles, regional retailers are transforming into advertising technology platforms."},{"id":6,"c":"Behind the Scenes","t":"From Classroom Theory to Real Publication: How We Built the Marketing Insights Lab","x":"A transparent reflection on our student-led editorial workflows, research methodologies, and challenges building an academic publication.","a":1,"d":"2026-08-27","cv":"https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Textbooks teach marketing frameworks that were formulated before smartphones existed. Our goal when launching the Marketing Insights Lab at British Management University was to create a sandbox where students analyze live campaigns, publish under their own byline, and build a competitive professional portfolio."},{"id":7,"c":"Events","t":"Recap: Our First Lab Industry Meetup with Regional CMOs","x":"Highlights, panel discussions, and key lessons from our inaugural on-campus symposium connecting students with brand executives.","a":6,"d":"2026-08-20","cv":"https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Over 120 students and 8 invited brand directors gathered at the BMU Main Auditorium for an intensive panel discussion on brand positioning and modern consumer analytics."}],"team":[{"id":1,"n":"Ayder Parmankulov","r":"Editor-in-Chief & Co-Founder","g":"Leadership","bio":"Leads the editorial vision, publication roadmap, and function admToast(msg, type) {
  const t = document.getElementById("adm-toast");
  if (!t) return;
  t.innerHTML = (type === 'err' ? '✕ ' : '✓ ') + '<span>' + esc(msg) + '</span>';
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3200);
}

function admLogin(e) {
  e.preventDefault();
  const pwd = (document.getElementById("adm_pwd").value || "").trim();
  const exp = (S.cfg && S.cfg.adminPass) || "admin123";
  if (pwd === exp) {
    EDIT = true;
    try { sessionStorage.setItem("lab_admin_auth", "1"); } catch(err) {}
    location.hash = "#/admin";
    render();
    admToast("Authenticated successfully as Administrator");
  } else {
    const err = document.getElementById("adm_err");
    if (err) err.style.display = "block";
  }
}

function admLogout() {
  EDIT = false;
  try { sessionStorage.removeItem("lab_admin_auth"); } catch(err) {}
  location.hash = "#/home";
  render();
  admToast("Logged out successfully");
}

function admPersist(msg) {
  try {
    localStorage.setItem("marketing_lab_v3_data", JSON.stringify(S));
  } catch(e) {
    console.error("Storage error:", e);
  }
  if (msg) admToast(msg);
  render();
}

function setAdmTab(tab) {
  ADM_TAB = tab;
  render();
}

function admGoTab(tab) {
  setAdmTab(tab);
  location.hash = '#/admin';
}

function admTogglePwd() {
  const p = document.getElementById('adm_pwd');

function admPreviewImg(id, val) {

  if (listEl) {

}

function admRenderPostsList() {
  const filtered = S.posts.filter(p => {
    const matchCat = !ADM_POST_CAT || p.c === ADM_POST_CAT;
    const matchSearch = !ADM_POST_SEARCH || p.t.toLowerCase().includes(ADM_POST_SEARCH) || (p.x || '').toLowerCase().includes(ADM_POST_SEARCH);
    return matchCat && matchSearch;
  });

  if (!filtered.length) {
    return '<div style="text-align:center;padding:40px;color:var(--mu)">No publications match your filter criteria.</div>';
  }

  return filtered.map(p => {
    const author = getAuthor(p.a);
    return '<div class="adm-row">' +
      '<div class="adm-row-info">' +
      '<div class="adm-thumb">' + (p.cv ? '<img src="' + esc(p.cv) + '" style="width:100%;height:100%;object-fit:cover">' : esc(p.c.slice(0, 3))) + '</div>' +
      '<div>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">' +
      '<span class="adm-badge" style="background:var(--bu);color:#fff">' + esc(p.c) + '</span>' +
      (p.f ? '<span class="adm-badge-feat">★ Featured</span>' : '') +
      '</div>' +
      '<strong style="font-size:16px;display:block">' + esc(p.t) + '</strong>' +
      '<small style="color:var(--mu)">' + esc(p.d) + ' · Author: ' + esc(author.n) + '</small>' +
      '</div></div>' +
      '<div class="adm-row-actions">' +
      '<button class="btn sm ' + (p.f ? 'gold' : 'sec') + '" onclick="admToggleFeatured(' + p.id + ')" title="Toggle Featured on homepage">' + (p.f ? '★ Featured' : '☆ Feature') + '</button>' +
      '<a class="btn sm sec" href="#/article/' + p.id + '" target="_blank" title="Preview article">View ↗</a>' +
      '<button class="btn sm" onclick="admEditPost(' + p.id + ')">Edit</button>' +
      '<button class="btn sm d" onclick="admDeletePost(' + p.id + ')">Delete</button>' +
      '</div></div>';
  }).join('');
}

function admToggleFeatured(id) {
  const post = S.posts.find(x => x.id === id);
  if (post) {
    const next = !post.f;
    if (next) S.posts.forEach(x => x.f = false);
    post.f = next;
    admPersist(next ? 'Marked as Featured Publication!' : 'Removed from Featured');
  }
}

function admDeletePost(id) {

function admSavePost(e, id, isNew) {
  e.preventDefault();
  const f = e.target.elements;
  const postObj = {
    id: id,
    t: f.t.value.trim(),
    c: f.c.value,
    a: Number(f.a.value),
    d: f.d.value,
    x: f.x.value.trim(),
    b: f.b.value.trim(),
    cv: f.cv.value.trim(),
    f: f.f.checked
  };

  if (postObj.f) {
    S.posts.forEach(x => { if (x.id !== id) x.f = false; });
  }

  const idx = S.posts.findIndex(x => x.id === id);
  if (idx < 0) {
    S.posts.unshift(postObj);
  } else {
    S.posts[idx] = postObj;
  }

  admCloseModal();
  admPersist(isNew ? "New publication created!" : "Publication updated successfully!");
}

// Data Engine & Export
function admGenerateStandaloneHtml() {
  const clone = document.documentElement.cloneNode(true);
  const toast = clone.querySelector("#adm-toast"); if (toast) { toast.className = ""; toast.innerHTML = ""; }
  const modal = clone.querySelector("#adm-modal-container"); if (modal) modal.innerHTML = "";
  clone.querySelector("#app").innerHTML = "";
  clone.querySelector("#pb").style.transform = "scaleX(0)";
  clone.querySelectorAll("#nav a").forEach(a => a.className = "");

  const dataScript = clone.querySelector("#data");
  if (dataScript) {
    dataScript.textContent = JSON.stringify(S, null, 2).replace(/</g, "\\u003c");
  }

  return "<!DOCTYPE html>\n" + clone.outerHTML;
}

function admDownloadHtml() {
  const content = admGenerateStandaloneHtml();
  const blob = new Blob([content], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  admToast("index.html downloaded with all current data baked in!");
}

function admExportJson() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "marketing-lab-v3-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  admToast("Backup JSON file exported!");
}

function admImportJsonPrompt() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (parsed && parsed.posts && parsed.team) {
          S = parsed;
          admPersist("Backup imported and restored successfully!");
        } else {
          alert("Invalid backup format: missing posts or team data.");
        }
      } catch(err) {
        alert("Failed to parse JSON backup file.");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

on pieces","Thought leadership that questions common marketing assumptions."],["Industry news","Fast, contextualised takes on marketing developments."],["Behind the scenes","How our editorial team works, researches and edits."],["Lab events","Workshops, speaker sessions and student hackathons."]],"cats":["Campaign Analysis","Research","Educational","Opinion","News","Behind the Scenes","Events"],"posts":[{"id":1,"c":"Campaign Analysis","t":"How Red Bull Built a $10B Media Powerhouse Disguised as an Energy Drink","x":"An in-depth breakdown of Red Bull's non-traditional marketing blueprint: content studio ownership, event IP, and lifestyle positioning over product ads.","a":1,"d":"2026-10-14","cv":"https://images.unsplash.com/photo-1551698618-1dfe5d97d256?auto=format&fit=crop&w=1200&q=80","f":true,"b":"Most consumer packaged goods (CPG) companies spend 20% to 30% of their revenue on traditional performance marketing and media buying. Red Bull chose a radically different path: they built a media company that happens to sell an energy drink in a silver-and-blue can.\n\n### 1. The Strategy: Don't Buy Ads, Own the Culture\nDietrich Mateschitz famously declared that Red Bull wasn't competing for shelf space; it was competing for adrenaline. Instead of sponsoring existing sports teams, Red Bull founded its own: Formula 1 championship teams, soccer clubs across three continents, and extreme stunt operations like Felix Baumgartner's Stratos jump from the edge of space.\n\n> \"Red Bull does not sponsor events. Red Bull creates and owns the intellectual property that fans obsess over.\"\n\n### 2. The Content Studio Flywheel\nBy forming Red Bull Media House in 2007, the brand transitioned from sponsor to production powerhouse:\n- **Licensing Revenue:** High-production films and documentaries sold to Netflix, ESPN, and national broadcasters.\n- **Organic Virality:** Over 15 million YouTube subscribers generating billions of organic impressions at near-zero marginal cost.\n- **Zero Mention of the Product:** The can rarely appears in their flagship documentaries. The brand is synonymous with extreme human achievement.\n\n### Key Takeaways for Student Marketers:\n1. **Audience-First Architecture:** Identify the emotional peak of your target audience and build media around that feeling.\n2. **IP Ownership Beats Renting:** When you own the tournament or media platform, you capture all downstream audience data and brand equity.\n3. **Product as a Badge:** The physical product becomes a ticket to belong to a global community rather than merely a beverage."},{"id":2,"c":"Research","t":"Gen Z Consumer Behavior in Central Asia: The Rise of Social Commerce & FinTech","x":"Empirical survey data from 450+ university students examining payment frictionless-ness, influencer conversion credibility, and short-form video engagement.","a":2,"d":"2026-09-24","cv":"https://images.unsplash.com/photo-1551836022-d5d88e9218df?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Over the past three years, the convergence of high mobile penetration and super-app fintech has transformed how Central Asian youth discover, evaluate, and purchase products. Our research team at Marketing Insights Lab surveyed 450 undergraduate and postgraduate students to analyze purchasing funnels.\n\n### 1. The Frictionless Checkout Revolution\nOver 78% of surveyed respondents reported completing purchases directly via in-app marketplaces or peer-to-peer digital checkout rather than traditional point-of-sale or standalone eCommerce websites. Speed and zero-step onboarding trump brand loyalty in everyday transactions.\n\n### 2. Micro-Influencer Trust vs. Macro Celebrity Ads\nStudents demonstrated an 82% higher willingness to purchase products recommended by niche domain specialists (under 25,000 followers) compared to mainstream celebrity brand ambassadors. Authenticity in unedited vertical video format drove 3.4x higher conversion metrics."},{"id":3,"c":"Opinion","t":"Is AI-Generated Advertising Worth the Risk or Exposing Mediocre Copywriting?","x":"Why large language models will commoditize surface-level creative output while exponentially increasing the value of genuine brand taste and contrarian positioning.","a":4,"d":"2026-09-17","cv":"https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80","f":false,"b":"As generative AI tools flood agency workflows with instant copy variants and synthetic imagery, marketing departments face an unexpected paradox: when creating content becomes effortless, standing out becomes exponentially harder.\n\n### The Sea of Synthesised Blandness\nAI models are trained to predict the most probable next token — meaning they inherently generate the average of human creative expression. If your brand positioning relies on generic adjectives, AI will replace you tomorrow.\n\n### What Remains Irreplaceable:\n- **Original Taste:** Knowing what *not* to say.\n- **Cultural Subversion:** Spotting emergent cultural tensions before they enter the training dataset.\n- **Audience Empathy:** Understanding human emotional friction that raw data cannot capture."},{"id":4,"c":"Educational","t":"The Complete Guide to Brand Archetypes: Crafting Distinctive Brand Voice in 2026","x":"A step-by-step practical framework adapted from Carl Jung and Margaret Mark to align brand storytelling, visual identity, and messaging tone.","a":3,"d":"2026-09-10","cv":"https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Every enduring brand in history represents a psychological archetype: Nike is The Hero, Harley-Davidson is The Outlaw, Apple is The Creator, and Dove is The Innocent.\n\n### Why Archetypes Matter in Marketing\nWithout an archetype, marketing copy drifts across conflicting tones depending on who writes the copy that day. With a defined archetype, every Instagram caption, press release, and packaging copy flows from a unified character blueprint."},{"id":5,"c":"News","t":"Retail Media Networks & Third-Party Cookies: What Marketers Must Prepare for in 2026","x":"Key news and developments on retail media networks, first-party data capture, and privacy-preserving attribution models.","a":5,"d":"2026-09-03","cv":"https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Retail Media Networks (RMNs) have surpassed traditional linear television advertising in total annual ad spend. By monetising digital checkout aisles, regional retailers are transforming into advertising technology platforms."},{"id":6,"c":"Behind the Scenes","t":"From Classroom Theory to Real Publication: How We Built the Marketing Insights Lab","x":"A transparent reflection on our student-led editorial workflows, research methodologies, and challenges building an academic publication.","a":1,"d":"2026-08-27","cv":"https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Textbooks teach marketing frameworks that were formulated before smartphones existed. Our goal when launching the Marketing Insights Lab at British Management University was to create a sandbox where students analyze live campaigns, publish under their own byline, and build a competitive professional portfolio."},{"id":7,"c":"Events","t":"Recap: Our First Lab Industry Meetup with Regional CMOs","x":"Highlights, panel discussions, and key lessons from our inaugural on-campus symposium connecting students with brand executives.","a":6,"d":"2026-08-20","cv":"https://images.unsplash.com/photo-1511578314322-379afb476865?auto=format&fit=crop&w=1200&q=80","f":false,"b":"Over 120 students and 8 invited brand directors gathered at the BMU Main Auditorium for an intensive panel discussion on brand positioning and modern consumer analytics."}],"team":[{"id":1,"n":"Ayder Parmankulov","r":"Editor-in-Chief & Co-Founder","g":"Leadership","bio":"Leads the editorial vision, publication roadmap, an       '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h3 style="font-family:Playfair Display,Georgia,serif;font-size:20px;margin:0">4. Interactive FAQ Questions</h3><button type="button" class="btn sm" onclick="admAddFaq()">+ Add FAQ Question</button></div>' +

      '<button class="btn sm" type="submit" style="margin-top:10px">Save FAQ Questions</button>' +

      '</div>';
  } else if (ADM_TAB === 'settings') {
    const statInputs = (S.cfg.stats || []).map((s, i) => '<div class="adm-grid-2" style="margin-bottom:8px"><input name="stat_' + i + '_v" value="' + esc(s[0]) + '" placeholder="e.g. 500+"><input name="stat_' + i + '_l" value="' + esc(s[1]) + '" placeholder="e.g. Campus Members"></div>').join('');

      '<h2 class="adm-card-title" style="margin-bottom:6px">Site Settings & Channels</h2>' +
      '<p style="color:var(--mu);font-size:13px;margin-bottom:24px">Configure administrator credentials, contact routing, and official social accounts.</p>' +

      '<h3 style="font-family:Playfair Display,Georgia,serif;font-size:18px;border-bottom:1px solid var(--ln);padding-bottom:6px">Security Credentials</h3>' +
      '<label>Administrator Password (used to unlock this panel)<input type="password" name="adminPass" value="' + esc(S.cfg.adminPass || 'admin123') + '" required></label>' +
      '<h3 style="font-family:Playfair Display,Georgia,serif;font-size:18px;border-bottom:1px solid var(--ln);padding-bottom:6px;margin-top:28px">Contact & Application Routing</h3>' +
      '<label>Contact & Editorial Inquiries Email<input type="email" name="email" value="' + esc(S.cfg.email) + '" required placeholder="marketinglab@bmu-edu.uz"></label>' +
      '<label>External Application Form URL (Google Forms, Tally, Typeform)<input type="url" name="joinUrl" value="' + esc(S.cfg.joinUrl || '') + '" placeholder="https://tally.so/... (Leave blank for mailto application)"></label>' +
      '<label>Newsletter Signup Link<input type="url" name="newsUrl" value="' + esc(S.cfg.newsUrl || '') + '" placeholder="https://..."></label>' +
      '<h3 style="font-family:Playfair Display,Georgia,serif;font-size:18px;border-bottom:1px solid var(--ln);padding-bottom:6px;margin-top:28px">Official Social Channels</h3>' +
      '<div class="adm-grid-2">' +
      '<label>Telegram Channel URL<input type="url" name="soc_tg" value="' + esc(S.cfg.soc.tg || '') + '" placeholder="https://t.me/..."></label>' +
      '<label>LinkedIn Page URL<input type="url" name="soc_li" value="' + esc(S.cfg.soc.li || '') + '" placeholder="https://linkedin.com/..."></label>' +
      '</div>' +
      '<div class="adm-grid-2">' +
      '<label>Instagram Profile URL<input type="url" name="soc_ig" value="' + esc(S.cfg.soc.ig || '') + '" placeholder="https://instagram.com/..."></label>' +
      '<label>YouTube Channel URL<input type="url" name="soc_yt" value="' + esc(S.cfg.soc.yt || '') + '" placeholder="https://youtube.com/..."></label>' +
      '</div>' +
      '<h3 style="font-family:Playfair Display,Georgia,serif;font-size:18px;border-bottom:1px solid var(--ln);padding-bottom:6px;margin-top:28px">Metric Stats (Counter Bar)</h3>' +
      statInputs +
      '<div style="margin-top:28px"><button class="btn" type="submit">Save Site Settings</button></div>' +
      '</form>' +
      '</div>';
  } else if (ADM_TAB === 'data') {
    tabContent = '<div class="adm-card">' +
      '<h2 class="adm-card-title" style="margin-bottom:6px">Data Engine & Deployment</h2>' +
      '<p style="color:var(--mu);font-size:13px;margin-bottom:24px">Export backups, import previous archives, or download the full HTML file for instant deployment.</p>' +
      '<div class="adm-row" style="padding:22px;margin-bottom:16px">' +
      '<div><strong style="font-size:18px;display:block">💾 Download Standalone index.html</strong><p style="color:var(--mu);margin:4px 0 0;font-size:14px">Bundles all your customized articles, team members, and settings directly into a single production-ready HTML file. Upload this directly to GitHub Pages to make changes permanent.</p></div>' +
      '<button class="btn gold" onclick="admDownloadHtml()">Download index.html</button>' +
      '</div>' +
      '<div class="adm-row" style="padding:22px;margin-bottom:16px">' +
      '<div><strong style="font-size:18px;display:block">📦 JSON Data Backup</strong><p style="color:var(--mu);margin:4px 0 0;font-size:14px">Export your raw data (publications, team, texts, and config) as a clean JSON backup file.</p></div>' +
      '<div style="display:flex;gap:10px"><button class="btn sec" onclick="admExportJson()">Export JSON</button><button class="btn sec" onclick="admImportJsonPrompt()">Import JSON</button></div>' +
      '</div>' +
      '<div class="adm-row" style="padding:22px;border-color:rgba(185,28,28,0.4)">' +
      '<div><strong style="font-size:18px;display:block;color:#fca5a5">⚠️ Reset to Factory Defaults</strong><p style="color:var(--mu);margin:4px 0 0;font-size:14px">Clears local browser cache and restores initial demo articles and team members.</p></div>' +
      '<button class="btn d" onclick="admResetDefaults()">Reset Defaults</button>' +
      '</div>' +
      '</div>';
  }

  return '<div class="adm-wrap">' +
    '<div class="adm-topbar">' +
    '<div>' +
    '<div style="display:flex;align-items:center;gap:10px">' +
    '<span class="adm-badge" style="background:var(--bu);color:#fff">Admin Hub</span>' +
    '<span style="font-size:12px;color:var(--mu);font-weight:600">Template v3</span>' +
    '</div>' +
    '<h1 style="font-size:clamp(28px,4vw,42px);margin:6px 0 2px">Editorial Management Panel</h1>' +
    '<p style="color:var(--mu);margin:0;font-size:14px">Manage publications, student researchers, page copy, and site configuration.</p>' +
    '</div>' +
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
    '<button class="btn sm gold" onclick="admDownloadHtml()" title="Download single-file index.html with all current data saved">💾 Download index.html</button>' +
    '<button class="btn sm sec" onclick="admExportJson()" title="Export JSON backup">📦 Backup JSON</button>' +
    '<a class="btn sm sec" href="#/home">View Site ↗</a>' +
    '<button class="btn sm d" onclick="admLogout()">Log Out</button>' +
    '</div>' +
    '</div>' +
    '<div class="adm-stat-cards">' +
    '<div class="adm-stat-box"><div class="adm-stat-num">' + S.posts.length + '</div><div class="adm-stat-lbl">Publications</div></div>' +
    '<div class="adm-stat-box"><div class="adm-stat-num">' + activeCount + '</div><div class="adm-stat-lbl">Active Team</div></div>' +
    '<div class="adm-stat-box"><div class="adm-stat-num">' + S.cats.length + '</div><div class="adm-stat-lbl">Categories</div></div>' +
    '<div class="adm-stat-box"><div class="adm-stat-num">' + (S.faq ? S.faq.length : 3) + '</div><div class="adm-stat-lbl">FAQ Topics</div></div>' +
    '</div>' +
    '<div class="adm-tabs" role="tablist">' +
    '<button class="adm-tab ' + (ADM_TAB === 'posts' ? 'on' : '') + '" onclick="setAdmTab(&apos;posts&apos;)">📝 Publications (' + S.posts.length + ')</button>' +
    '<button class="adm-tab ' + (ADM_TAB === 'team' ? 'on' : '') + '" onclick="setAdmTab(&apos;team&apos;)">👥 Team Roster (' + S.team.length + ')</button>' +
    '<button class="adm-tab ' + (ADM_TAB === 'texts' ? 'on' : '') + '" onclick="setAdmTab(&apos;texts&apos;)">✍️ Page Content & Copy</button>' +
    '<button class="adm-tab ' + (ADM_TAB === 'settings' ? 'on' : '') + '" onclick="setAdmTab(&apos;settings&apos;)">⚙️ Site Settings & Socials</button>' +
    '<button class="adm-tab ' + (ADM_TAB === 'data' ? 'on' : '') + '" onclick="setAdmTab(&apos;data&apos;)">💾 Data & Backup</button>' +
    '</div>' +
    tabContent +
    '</div>';
}

// ==========================================================================
// Main Application Engine & 3D Scroll Physics
// ==========================================================================
(()=>{
  const $ = s => document.querySelector(s),
        $$ = s => [...document.querySelectorAll(s)],
        cl = v => Math.max(0, Math.min(1, v)),
        de = document.documentElement,
        RM = matchMedia('(prefers-reduced-motion:reduce)').matches;

  const FX = {
    hero(el, p) {
      const logo = el.querySelector('.logo');
      if (logo) logo.style.transform = 'rotateY(' + (-40 + p * 80) + 'deg) rotateX(' + (10 - p * 20) + 'deg) translateZ(' + (p * 140) + 'px) scale(' + (1 + p * .18) + ')';
      el.querySelectorAll('.ring').forEach((r, i) => r.style.transform = 'rotateX(' + (68 - i * 8) + 'deg) rotateZ(' + ((i % 2 ? 1 : -1) * p * 120 + i * 40) + 'deg) scale(' + (.75 + i * .3) + ')');
      const h = el.querySelector('.ht');
      if (h) {
        h.style.opacity = 1 - p * 1.4;
        h.style.transform = 'translateY(' + (-p * 40) + 'px)';
      }
    },
    cyl(el, p) {
      const c = el.querySelector('.cyl');
      if (!c) return;
      const f = [...c.children], n = f.length, r = c.offsetWidth / 2 / Math.tan(Math.PI / n) + 18;
      c.style.setProperty('--r', r + 'px');
      c.style.setProperty('--a', 360 / n + 'deg');
      c.style.transform = 'translateZ(' + (-r) + 'px) rotateY(' + (-p * (n - 1) * 360 / n) + 'deg)';
      const t = p * (n - 1), a = Math.round(t);
      f.forEach((x, i) => {
        x.classList.toggle('on', i === a);
        x.style.setProperty('opacity', cl((2.5 - Math.abs(i - t)) / .8).toFixed(2), 'important');
      });
    },
    words(el, p) {
      const w = [...el.querySelectorAll('span')];
      w.forEach((s, i) => s.style.opacity = (.16 + .84 * cl(p * w.length * 1.25 - i)).toFixed(2));
    },
    tn(el, p) {
      const c = [...el.querySelectorAll('.tn')], t = p * (c.length - 1);
      c.forEach((x, i) => {
        const d = i - t;
        x.style.transform = 'translate(-50%,-50%) translateZ(' + (-d * 520) + 'px) rotateY(' + (-d * 14) + 'deg)';
        x.style.opacity = d < 0 ? cl(1 + d * 2.2) : cl(1 - d * .6);
      });
    }
  };

  const pr = el => {
    const r = el.getBoundingClientRect();
    return cl(-r.top / (r.height - innerHeight));
  };

  let TL = [], TI = [], PH = [], pb = $('#pb'), tk = 0;

  function tick() {
    const m = de.scrollHeight - innerHeight;
    if (pb) pb.style.transform = 'scaleX(' + (m > 0 ? scrollY / m : 0) + ')';
    TL.forEach(el => { if (FX[el.dataset.fx]) FX[el.dataset.fx](el, pr(el)); });
    TI.forEach(el => {
      const r = el.getBoundingClientRect(), v = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
      el.style.transform = 'perspective(1000px) rotateX(' + (v * 20).toFixed(1) + 'deg) rotateY(' + (-v * 10).toFixed(1) + 'deg)';
    });
    PH.forEach(el => {
      const p = cl(scrollY / (innerHeight * .7)), h = el.querySelector('h1');
      if (h) h.style.transform = 'rotateX(' + (p * 55) + 'deg) translateZ(' + (-p * 200) + 'px)';
      if (el.firstElementChild) el.firstElementChild.style.opacity = 1 - p * 1.1;
    });
  }

  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  }), { threshold: .12 });

  window.render = function() {
    const rawH = (location.hash.replace(/^#\/?/, '') || 'home').split('/'),
          k = R[rawH[0]] ? rawH[0] : 'home',
          app = $('#app');

    if (!app) return;
    app.innerHTML = R[k](rawH[1]);

    // Update navigation links dynamically
    const navLinks = [
      ['home', 'Home'],
      ['about', 'About'],
      ['publications', 'Publications'],
      ['team', 'Team'],
      ['join', 'Join'],
      ['contact', 'Contact']
    ];
    if (EDIT) {
      navLinks.push(['admin', 'Admin ⚙']);
      navLinks.push(['logout', 'Logout ↗']);
    }

    const navEl = $('#nav');
    if (navEl) {
      navEl.innerHTML = navLinks.map(l => {
        if (l[0] === 'logout') {
          return '<a href="javascript:void(0)" onclick="admLogout()" style="opacity:.75">' + l[1] + '</a>';
        }
        return '<a href="#/' + (l[0] === 'home' ? '' : l[0]) + '" data-r="' + l[0] + '" class="' + (l[0] === k ? 'on' : '') + '" style="' + (l[0] === 'admin' ? 'color:var(--gd);font-weight:700' : '') + '">' + l[1] + '</a>';
      }).join('');
    }

    $$('[data-lg]').forEach(i => i.src = LOGO);
    $$('.cyl').forEach(c => [...c.children].forEach((f, i) => f.style.setProperty('--i', i)));
    $$('[data-t]').forEach(p => p.innerHTML = p.dataset.t.split(' ').map(w => '<span>' + w + '</span>').join(' '));
    $$('.rv').forEach(e => io.observe(e));

    $$('.card').forEach(c => {
      c.addEventListener('pointermove', e => {
        const r = c.getBoundingClientRect();
        c.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 14 + 'deg');
        c.style.setProperty('--rx', (.5 - (e.clientY - r.top) / r.height) * 14 + 'deg');
      });
      c.addEventListener('pointerleave', () => {
        c.style.setProperty('--rx', '0deg');
        c.style.setProperty('--ry', '0deg');
      });
    });

    const ch = $('#chips');
    if (ch) {
      ch.onclick = e => {
        const b = e.target.closest('.cp');
        if (!b) return;
        $$('.cp').forEach(x => x.classList.toggle('on', x === b));
        const filtered = S.posts.filter(p => !b.dataset.c || p.c === b.dataset.c);
        $('#pl').innerHTML = filtered.map(card).join('');
        $$('#pl .rv').forEach(el => el.classList.add('in'));
      };
    }

    const st = $('#stage');
    if (st) {
      const hero = $('.hero');
      if (hero) {
        hero.addEventListener('pointermove', e => {
          st.style.setProperty('--mx', (e.clientX / innerWidth - .5).toFixed(2));
          st.style.setProperty('--my', (e.clientY / innerHeight - .5).toFixed(2));
        });
      }
    }

    TL = $$('.tall');
    TI = $$('[data-fx=tilt]');
    PH = $$('.ph');
    scrollTo(0, 0);
    if (!RM) tick();
  };

  if (RM) de.classList.add('rm');
  else {
    addEventListener('scroll', () => {
      if (!tk) {
        tk = 1;
        requestAnimationFrame(() => { tk = 0; tick(); });
      }
    }, { passive: true });
    addEventListener('resize', tick);
  }

  $$('[data-lg]').forEach(i => i.src = LOGO);
  addEventListener('hashchange', render);
  render();
})();

</script>
</body>
